name: Lint

# ─────────────────────────────────────────────────────────────────────────────
# Runs after changes land on main (push), plus on demand for a selected PR.
#
# MarketLab CI policy: hosted CI is Windows-only. There is no automatic hosted
# CI on pull requests and pre-merge validation is local/review-branch only. The
# meaningful checks run unchanged on a Windows runner after merge: clang-format
# (diff-scoped to the pushed change), clang-tidy (changed files, gating, exact
# check set and warnings-as-errors), cppcheck (whole tree,
# --error-exitcode=1), datahub-discipline and the scope-decision contract. The
# manual path uses the same strict changed-line/changed-file gates for the
# selected PR. It never defaults to an expensive whole-tree clang sweep.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'fincept-qt/src/**'
      - 'fincept-qt/CMakeLists.txt'
      - 'fincept-qt/.clang-tidy'
      - 'fincept-qt/.clang-format'
      - 'fincept-qt/.cppcheck-suppressions'
      - '.github/workflows/pr-gate.yml'
      - '.github/workflows/lint.yml'
      - '.github/scripts/enforce_scope_decision.sh'
      - '.github/scripts/test_scope_decision.sh'
      - '.github/scripts/resolve_lint_scope.py'
      - '.github/scripts/test_lint_scope.py'
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'PR number whose changes should be checked (open or merged)'
        required: true
        type: string

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: "6.8.3"
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia qtwebengine qtwebchannel qtpositioning qtserialport"
  # The Windows runner image's LLVM is used for clang-format/clang-tidy. The
  # previous Linux gate pinned clang 18, but that version cannot parse the
  # current MSVC STL (STL1000: expected Clang 19.0.0 or newer) in an MSVC
  # compile database, so the Windows port must use the modern toolchain.
  # Closest available Windows cppcheck build. 2.13.0 (the previous Ubuntu
  # package) is not published for Windows; 2.16.0 was validated locally on the
  # whole tree with zero warning/performance/portability diagnostics.
  CPPCHECK_VERSION: "2.16.0"

jobs:
  lint-scope:
    name: Resolve exact lint source and base
    runs-on: windows-latest
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test lint scope contract
        run: python .github/scripts/test_lint_scope.py
      - name: Resolve push range or selected PR merge-base/head
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/resolve_lint_scope.py

  # ── scope-decision-contract ─────────────────────────────────────────────────
  # Post-merge contract test: the scope-enforcement scripts stay covered even
  # though the automatic PR scope gate (pr-gate.yml) is disabled for this
  # fork. It runs the fail-closed contract that PR-gate logic depends on.
  scope-decision-contract:
    name: scope-decision-contract
    needs: lint-scope
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lint-scope.outputs.head_sha }}

      - name: Test fail-closed scope decision contract
        shell: bash
        run: bash .github/scripts/test_scope_decision.sh

  # ── clang-format ─────────────────────────────────────────────────────────────
  clang-format:
    name: clang-format
    needs: lint-scope
    runs-on: windows-latest
    env:
      LINT_BASE_SHA: ${{ needs.lint-scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.lint-scope.outputs.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show clang-format version
        shell: bash
        run: clang-format --version

      # Both push and manual PR paths check only the changed lines. A whole-file
      # --dry-run would flag pre-existing formatting in untouched lines and
      # fail a merge for code its author never wrote. The LLVM-shipped
      # git-clang-format Python script is invoked with the setup-python
      # interpreter instead of relying on its shebang / the Windows Store alias.
      - name: Check formatting of changed lines
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          LLVM_BIN="$(dirname "$(command -v clang-format)")"
          GCF="${LLVM_BIN}/git-clang-format"
          if [ ! -f "${GCF}" ]; then
            echo "::error::git-clang-format was not found in the installed LLVM; refusing to skip the diff-scoped format gate."
            exit 1
          fi
          BASE="${LINT_BASE_SHA}"
          if [ -z "${BASE}" ]; then
            echo "::error::Missing resolved lint base; refusing to skip the format gate."
            exit 1
          fi
          DIFF="$(python "$(cygpath -w "${GCF}")" --binary clang-format --diff --commit "${BASE}" -- 'src/*.cpp' 'src/*.h' 2>&1 || true)"
          case "${DIFF}" in
            *"no modified files"*|*"did not modify"*|"") echo "Changed lines are correctly formatted."; exit 0 ;;
          esac
          echo "${DIFF}"
          echo "::error::Formatting differs from .clang-format on lines this change touched. Run: git-clang-format --commit ${BASE}"
          exit 1

  # ── clang-tidy ───────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    needs: lint-scope
    runs-on: windows-latest
    env:
      LINT_BASE_SHA: ${{ needs.lint-scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.lint-scope.outputs.head_sha }}

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show clang-tidy version
        shell: bash
        run: clang-tidy --version

      # Qt 6.8.3 from aqt, matching the Windows build configuration. The
      # bundled OpenSSL tool supplies the headers/libs FindOpenSSL needs on
      # Windows (the Linux job got libssl-dev from apt).
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          tools: 'tools_opensslv3_x64'
          cache: true
          cache-key-prefix: qt-windows-x64-lint

      - name: Remove dangling Qt SQL driver plugin CMake configs
        shell: bash
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          fi

      # FINCEPT_DEV_BUILD=ON turns the unity build OFF. That is REQUIRED here:
      # with unity ON the compile database contains only unity_*.cxx entries,
      # so clang-tidy cannot find a compile command for an individual .cpp.
      #
      # CMAKE_DISABLE_PRECOMPILE_HEADERS=ON is also REQUIRED: the app target
      # uses target_precompile_headers(), so a normal compile command carries
      # `-include .../cmake_pch.hxx`; the PCH is a byproduct of a full compile
      # that this lint job never performs, and clang-tidy then dies with
      # "PCH file not found" on every changed file instead of analysing it.
      # Disabling PCH for this lint-only build removes the flag entirely; it
      # does not affect any release/CI build artifact.
      - name: Configure (generate compile_commands.json)
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DOPENSSL_ROOT_DIR="${QT_ROOT_DIR}/../../Tools/OpenSSLv3/Win_x64" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DFINCEPT_DEV_BUILD=ON \
            -DFINCEPT_BUILD_INSTALLER=OFF \
            -DDEPLOY_QT=OFF

      # moc/uic output must exist before clang-tidy parses anything that
      # includes it, otherwise every hit is a bogus "file not found".
      - name: Generate moc/uic sources
        shell: bash
        working-directory: fincept-qt
        run: |
          cmake --build build --target FinceptTerminal_autogen --parallel || echo "::warning::autogen target unavailable — clang-tidy may report missing generated headers"

      # ── Push and selected-PR paths: incremental + GATING ───────────────────
      # Narrow, high-signal checks only. bugprone-easily-swappable-parameters,
      # -narrowing-conversions and -branch-clone are excluded: thousands of
      # pre-existing hits, near-zero defect yield. The check set and
      # warnings-as-errors behaviour are unchanged from the pre-merge gate.
      - name: clang-tidy (changed files, gating)
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          BASE="${LINT_BASE_SHA}"
          if [ -z "${BASE}" ]; then
            echo "::error::Missing resolved lint base; refusing to skip the clang-tidy gate."
            exit 1
          fi
          CHECKS='-*,bugprone-*,concurrency-*,performance-move-const-arg,-bugprone-easily-swappable-parameters,-bugprone-narrowing-conversions,-bugprone-branch-clone'
          if ! git -C .. diff --name-only --diff-filter=ACMR "${BASE}" HEAD -- 'fincept-qt/src/**/*.cpp' \
            | sed 's|^fincept-qt/||' > /tmp/changed.txt; then
            echo "::error::Unable to determine changed C++ files for clang-tidy."
            exit 1
          fi
          CHANGED_COUNT=$(wc -l < /tmp/changed.txt | tr -d ' ')
          if [ "${CHANGED_COUNT}" = "0" ]; then
            echo "No changed existing .cpp files; clang-tidy is not applicable to this selected change."
            exit 0
          fi
          # Keep only files the compile database actually knows about (a brand
          # new .cpp not yet added to CMakeLists.txt has no compile command).
          # The Windows compile database records backslash paths, so the POSIX
          # forward-slash form alone would silently skip every file.
          : > /tmp/tidy_files.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            [ -f "$f" ] || continue
            f_win="$(printf '%s' "$f" | sed 's|/|\\\\|g')"
            if grep -qF "${f}\"" build/compile_commands.json 2>/dev/null || \
               grep -qF "${f_win}\"" build/compile_commands.json 2>/dev/null; then
              echo "$f" >> /tmp/tidy_files.txt
            else
              echo "::warning::$f not in compile_commands.json — skipped by clang-tidy"
            fi
          done < /tmp/changed.txt
          COUNT=$(wc -l < /tmp/tidy_files.txt | tr -d ' ')
          if [ "${COUNT}" = "0" ]; then
            echo "::error::No existing, non-deleted changed .cpp files with compile commands were found; refusing to pass without analysing a changed compiled file."
            exit 1
          fi
          echo "Analysing ${COUNT} changed file(s) with: ${CHECKS}"
          # The MSVC compile database already carries /std:c++20; a Unix-style
          # -std=c++20 extra arg is rejected in clang-cl mode as
          # clang-diagnostic-unknown-argument and fails every analysed file.
          xargs -a /tmp/tidy_files.txt -P "${NUMBER_OF_PROCESSORS:-4}" -n 1 \
            clang-tidy -p build \
              --checks="${CHECKS}" \
              --warnings-as-errors="${CHECKS}" \
              --quiet \
              --extra-arg=--driver-mode=cl
          echo "clang-tidy clean on changed files."

  # ── datahub-discipline ───────────────────────────────────────────────────────
  # Enforces DataHub rules D1 and D4 (see fincept-qt/CLAUDE.md §D):
  #   D1 — screens must not spawn Python directly.
  #   D4 — consumers must not call service fetch_* callbacks.
  # If this step fails, route the offending code through DataHub. See
  # fincept-qt/DATAHUB_ARCHITECTURE.md §4 and docs/DATAHUB_TOPICS.md for the
  # producer + topic you should be using instead.
  datahub-discipline:
    name: datahub-discipline
    needs: lint-scope
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lint-scope.outputs.head_sha }}

      - name: Check screens/ does not call PythonRunner directly
        shell: bash
        working-directory: fincept-qt
        run: |
          # GRANDFATHER LIST — two pre-existing D1 violations, present when this
          # check first became a PR gate. New violations anywhere else fail the
          # build; editing one of these files for an unrelated reason does not.
          # Delete an entry here the moment its file is migrated to a Producer.
          ALLOW='src/screens/equity_research/EquityResearchScreen.cpp|src/screens/portfolio/views/EconomicsView.cpp'
          violations=$(grep -rn --include='*.cpp' --include='*.h' \
              'PythonRunner::instance()\.run(' src/screens/ | grep -vE "^(${ALLOW})" || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo ""
            echo "::error::D1 violation — screens must not call PythonRunner directly."
            echo "Route through a Producer registered with DataHub."
            echo "See fincept-qt/DATAHUB_ARCHITECTURE.md §4."
            exit 1
          fi
          echo "D1 — screens are clean (excluding the 2 grandfathered files)."

      - name: Check screens/ does not call deprecated service fetch_* APIs
        shell: bash
        working-directory: fincept-qt
        run: |
          # D4 exempts one-shot catalog/info APIs that have no hub topic:
          #   MarketDataService::fetch_info, MarketDataService::fetch_news,
          #   DBnomicsService::fetch_providers / fetch_datasets / fetch_series /
          #   fetch_observations. See fincept-qt/CLAUDE.md §D4 for the rule.
          # Match any streaming fetch_* call, then grep -v the allowed ones.
          violations=$(grep -rnE --include='*.cpp' --include='*.h' \
              '(MarketDataService|NewsService|EconomicsService|DBnomicsService|GovDataService)::instance\(\)\.fetch_' \
              src/screens/ \
            | grep -vE 'MarketDataService::instance\(\)\.fetch_(info|news)\b' \
            | grep -vE 'DBnomicsService::instance\(\)\.fetch_(providers|datasets|series|observations)\b' \
            || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo ""
            echo "::error::D4 violation — consumers must not call streaming fetch_* APIs."
            echo "Use DataHub::subscribe() for live data, DataHub::peek() for snapshots."
            echo "See fincept-qt/DATAHUB_ARCHITECTURE.md §4 and docs/DATAHUB_TOPICS.md."
            exit 1
          fi
          echo "D4 — screens are clean."

  # ── cppcheck ─────────────────────────────────────────────────────────────────
  # Gates via --error-exitcode=1 and runs the whole tree. The only added
  # suppression is the informational-only `normalCheckLevelMaxBranches` notice
  # that cppcheck >= 2.14 emits on this tree and that --error-exitcode counts;
  # it is not a warning/performance/portability diagnostic, and no tracked
  # suppression entry is added. The Windows build is pinned to the closest
  # available version and was validated locally against the whole tree.
  cppcheck:
    name: cppcheck
    needs: lint-scope
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lint-scope.outputs.head_sha }}

      - name: Install cppcheck ${{ env.CPPCHECK_VERSION }}
        shell: pwsh
        run: |
          choco install cppcheck --version=${{ env.CPPCHECK_VERSION }} -y --no-progress
          echo "C:\Program Files\Cppcheck" >> $env:GITHUB_PATH

      - name: Run cppcheck
        shell: bash
        working-directory: fincept-qt
        run: |
          command -v cppcheck
          cppcheck --version
          cppcheck \
            --enable=warning,performance,portability \
            --suppressions-list=.cppcheck-suppressions \
            --inline-suppr \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=normalCheckLevelMaxBranches \
            -I src \
            -j "${NUMBER_OF_PROCESSORS:-4}" \
            src 2>&1
          echo "cppcheck complete."
