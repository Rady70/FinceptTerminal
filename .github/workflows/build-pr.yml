name: PR Build (compile + self-test gate)

# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS WORKFLOW EXISTS
#   MarketLab CI cost policy: hosted GitHub CI runs only after a change is
#   merged/pushed to main; pre-merge validation is local/review-branch only.
#   This workflow is therefore main-only (plus optional manual dispatch), and
#   Windows is the only hosted build platform.
#
#   It builds the same release-style Windows configuration release.yml builds
#   and runs the headless self-tests, so a tag push stays boring. /WX and
#   -Werror are enabled whenever $CI is set, which GitHub Actions always does,
#   and the unity-build assertion below keeps this gate on the release-style
#   configuration (FINCEPT_DEV_BUILD=OFF).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'fincept-qt/**'
      - '.github/workflows/build-pr.yml'
      - '.github/scripts/ci_app_checks.sh'
      - '.github/scripts/check_version_drift.sh'
  workflow_dispatch:

# One build per main push. A new push cancels the in-flight run — these are
# 30–60 minute jobs and superseded runs are wasted runner time.
concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: "6.8.3"
  # Mirrors release.yml — qtserialport is required because the qtpositioning
  # NMEA plugin links Qt6SerialPort.
  QT_MODULES: "qtcharts qtwebsockets qtmultimedia qtwebengine qtwebchannel qtpositioning qtserialport"
  # MarketLab fork: the fork's CMake sets OUTPUT_NAME "MarketLabTerminal", so
  # the CI gates must exercise the fork binary, not the upstream name.
  APP_NAME: MarketLabTerminal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Cheap gates first — these finish in seconds and fail fast ──────────────
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate resolves the Flatpak manifest's pinned source
          # commit and reads that commit's CMake project version.
          fetch-depth: 0
      - name: Install PyYAML for packaging validation
        run: sudo apt-get update -qq && sudo apt-get install -y python3-yaml
      # CMakeLists.txt project(... VERSION x.y.z) is the source of truth; the
      # flatpak / AppImage / appdata manifests each carry a hand-written copy.
      # A stale copy ships a bundle whose CFBundleVersion / appdata version
      # disagrees with the binary and breaks the updater's version compare.
      - name: Check packaging metadata matches CMakeLists.txt
        run: bash .github/scripts/check_version_drift.sh .

  build:
    name: ${{ matrix.platform }} build + self-tests
    needs: version-consistency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ── Windows: OpenSSL (dynamic) + zlib (STATIC) via vcpkg ──────────────
      # Copied from release.yml. The forward-slash normalisation and the
      # zs.lib → zlib.lib alias are load-bearing: without them FindZLIB falls
      # through to a stray system zlib and the exe imports an unbundled z.dll
      # (the v4.1.0 launch failure).
      - name: Install OpenSSL + zlib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
          VCPKG_ROOT="${VCPKG_ROOT//\\//}"
          "$VCPKG_ROOT/vcpkg" install openssl:x64-windows zlib:x64-windows-static-md --no-print-usage
          OPENSSL_DIR="$VCPKG_ROOT/installed/x64-windows"
          ZLIB_DIR="$VCPKG_ROOT/installed/x64-windows-static-md"
          echo "OPENSSL_ROOT_DIR=$OPENSSL_DIR" >> "$GITHUB_ENV"
          echo "ZLIB_ROOT=$ZLIB_DIR" >> "$GITHUB_ENV"
          if [ ! -f "$ZLIB_DIR/lib/zlib.lib" ]; then
            ALT="$(ls "$ZLIB_DIR"/lib/z*.lib 2>/dev/null | head -1 || true)"
            [ -n "$ALT" ] && cp "$ALT" "$ZLIB_DIR/lib/zlib.lib"
          fi
          [ -f "$ZLIB_DIR/lib/zlib.lib" ] || { echo "::error::static zlib archive not found"; exit 1; }

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ env.QT_MODULES }}
          cache: true
          cache-key-prefix: qt-${{ matrix.platform }}-pr

      # aqtinstall ships Qt6Sql's MySQL/PSQL/ODBC/Mimer *DriverPlugin CMake
      # target files but not the plugin binaries, so find_package(Qt6 ... Sql)
      # aborts at configure time. We only use SQLite. (release.yml does the
      # same in all three of its build jobs.)
      - name: Remove dangling Qt SQL driver plugin CMake configs
        shell: bash
        run: |
          set -euo pipefail
          SQL_CMAKE="${QT_ROOT_DIR}/lib/cmake/Qt6Sql"
          if [ -d "${SQL_CMAKE}" ]; then
            for drv in QMYSQLDriverPlugin QPSQLDriverPlugin QODBCDriverPlugin QMimerSQLDriverPlugin; do
              rm -fv "${SQL_CMAKE}/Qt6${drv}"*.cmake || true
            done
          else
            echo "::warning::${SQL_CMAKE} not found — skipping SQL plugin config cleanup"
          fi

      # ── Configure ─────────────────────────────────────────────────────────
      # CRITICAL: this must be the RELEASE-STYLE configuration, i.e. unity
      # build ON (FINCEPT_DEV_BUILD=OFF, the default). The local `win-dev`
      # preset turns unity OFF, so a win-dev-shaped PR build would silently
      # miss the exact class of error this gate exists to catch: unity
      # concatenates ~20 .cpp files into one TU, so two file-scope symbols
      # with the same name in the same batch become a hard redefinition error
      # that appears ONLY on a unity build — and adding or removing a source
      # file re-batches everything after it. GitHub Actions always sets
      # CI=true, so CMakeLists.txt also turns on /WX (MSVC) and -Werror
      # (GCC/Clang) here, exactly as it does on the release path.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT_DIR}" \
            -DZLIB_ROOT="${ZLIB_ROOT}" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DFINCEPT_DEV_BUILD=OFF \
            -DFINCEPT_BUILD_INSTALLER=OFF

      # Guard against someone "fixing" a slow build by flipping the preset
      # to the dev configuration — that would quietly delete the unity-batch
      # coverage this workflow exists to provide. The build dir is always
      # fresh on a runner, so the generated unity sources are proof.
      - name: Assert unity build is ON
        shell: bash
        working-directory: fincept-qt
        run: |
          set -euo pipefail
          if ! find build -name 'unity_*_cxx.cxx' -print -quit | grep -q .; then
            echo "::error::No unity sources generated — this build is NOT the release-style configuration."
            echo "::error::CI must build with CMAKE_UNITY_BUILD=ON (FINCEPT_DEV_BUILD=OFF) or it cannot catch unity-batch symbol collisions."
            exit 1
          fi
          echo "Unity build confirmed (batch size 20, matching the release path)."

      - name: Build
        shell: bash
        working-directory: fincept-qt
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} \
            --parallel $(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

      # ── Headless self-tests ───────────────────────────────────────────────
      # The flag list is discovered from the binary (--selftest-list) with a
      # hard-coded fallback — see .github/scripts/ci_app_checks.sh. Never
      # hand-maintain the list in YAML: it drifted once already and
      # --selftest-live-table ran nowhere for months.
      - name: Run self-tests (headless)
        shell: bash
        working-directory: fincept-qt
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BINARY="build/Release/${{ env.APP_NAME }}.exe"
          else
            BINARY="build/${{ env.APP_NAME }}"
          fi
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib:${LD_LIBRARY_PATH:-}"
          bash ../.github/scripts/ci_app_checks.sh selftests "$BINARY" ci
